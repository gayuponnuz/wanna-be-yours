
<!DOCTYPE html>
<html>
<head>
    <title>Will You Marry Me?</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #message {
            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 500px;

            text-align: center;

            color: white;

            font-family: Georgia, serif;

            font-size: 42px;

            font-weight: bold;

            line-height: 1.3;

            opacity: 0;

            text-shadow:
                0 0 5px white,
                0 0 15px #d580ff,
                0 0 30px #a020f0,
                0 0 50px #8a2be2;

            transition: opacity 5s ease;
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="message">
    Will You<br>
    Be Mine? ❤️
</div>


<script>

var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;




var centerX = canvas.width / 2;
var centerY = canvas.height / 2;




var heartSize = 17;




var totalParticles = 250;

var particles = [];




function getHeartPoint(t) {

    var x =
        16 * Math.pow(Math.sin(t), 3);

    var y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x * heartSize,
        y: y * heartSize
    };
}




for (var i = 0; i < totalParticles; i++) {

    var angle =
        (Math.PI * 2 * i) / totalParticles;

    var heart =
        getHeartPoint(angle);

    particles.push({

        startX:
            Math.random() * canvas.width,

        startY:
            Math.random() * canvas.height,

        targetX:
            centerX + heart.x,

        targetY:
            centerY - heart.y,

        size:
            Math.random() * 2 + 1

    });
}




function drawParticle(x, y, size) {

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#c77dff";

    ctx.shadowBlur = 15;

    ctx.shadowColor = "#a020f0";

    ctx.fill();

    ctx.shadowBlur = 0;
}




function ease(t) {

    return t * t * (3 - 2 * t);

}



var startTime = null;

var animationDuration = 15000; 


function animate(time) {

    if (!startTime) {

        startTime = time;

    }


    var elapsed =
        time - startTime;


    var progress =
        elapsed / animationDuration;


    if (progress > 1) {

        progress = 1;

    }


    var eased =
        ease(progress);


    
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    for (var i = 0; i < particles.length; i++) {

        var p = particles[i];


        var x =
            p.startX +
            (p.targetX - p.startX) *
            eased;


        var y =
            p.startY +
            (p.targetY - p.startY) *
            eased;


        drawParticle(
            x,
            y,
            p.size
        );

    }


    
    if (progress < 1) {

        requestAnimationFrame(animate);

    } else {

        
        showMessage();

    }

}




function showMessage() {

    setTimeout(function () {

        document.getElementById(
            "message"
        ).style.opacity = "1";

    }, 1000);

}





requestAnimationFrame(animate);




window.addEventListener(
    "resize",
    function () {

        canvas.width =
            window.innerWidth;

        canvas.height =
            window.innerHeight;

        centerX =
            canvas.width / 2;

        centerY =
            canvas.height / 2;

    }
);

</script>

</body>
</html>
